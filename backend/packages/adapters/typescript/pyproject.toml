[project]
name = "ci-adapters-typescript"
version = "0.1.0"
description = "TypeScript/JavaScript analyzer (React, Express, NestJS, Next.js) for Codebase Intelligence"
requires-python = ">=3.12"
dependencies = [
    "ci-core",
    "ci-parsers",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.entry-points."codebase_intelligence.analyzers"]
typescript = "ci_adapters_typescript:ANALYZER"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_adapters_typescript"]

[tool.uv.sources]
ci-core = { workspace = true }
ci-parsers = { workspace = true }
