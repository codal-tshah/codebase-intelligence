[project]
name = "ci-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing Codebase Intelligence graph tools"
requires-python = ">=3.12"
dependencies = [
    "ci-core",
    "ci-indexer",
    "ci-ai",
    "mcp>=1.2",
]

[project.scripts]
ci-mcp = "ci_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_mcp"]

[tool.uv.sources]
ci-core = { workspace = true }
ci-indexer = { workspace = true }
ci-ai = { workspace = true }
