name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run python ../scripts/check_licenses.py > /dev/null
      - run: uv run pytest -q
      - run: uv run ci analyze benchmarks/fixtures/synthetic_django
        env:
          CI_DATA_DIR: ${{ runner.temp }}/ci-data
      - run: uv run ci analyze benchmarks/fixtures/fullstack_app && uv run ci endpoints -p benchmarks/fixtures/fullstack_app
        env:
          CI_DATA_DIR: ${{ runner.temp }}/ci-data
      - run: uv run python benchmarks/score_benchmark.py --fixture benchmarks/fixtures/synthetic_django
        env:
          CI_DATA_DIR: ${{ runner.temp }}/ci-data

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Browser flows + axe (WCAG 2.2 A/AA) + offline check against the real API and the dev server.
    runs-on: ubuntu-latest
    needs: [test, frontend]
    env:
      CI_DATA_DIR: ${{ runner.temp }}/ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --all-packages --group dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      # ubuntu-latest ships Google Chrome; playwright.config uses channel "chrome" (no browser download)
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    # The image must keep building; it isn't pushed anywhere.
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codebase-intelligence:ci .
      - name: Smoke test (health + dashboard)
        run: |
          docker run -d --name ci -p 8000:8000 codebase-intelligence:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/ > /dev/null
          docker rm -f ci
