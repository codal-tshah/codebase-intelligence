[project]
name = "ci-security"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ci-core",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_security"]

[tool.uv.sources]
ci-core = { workspace = true }
