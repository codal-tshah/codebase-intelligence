[project]
name = "codebase-intelligence"
version = "0.1.0"
description = "AI-powered codebase intelligence and interactive architecture platform"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "ci-api",
    "ci-mcp",
    "ci-cli",
    "ci-adapters-django",
    "ci-adapters-typescript",
    "ci-indexer",
    "ci-ai",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/parsers",
    "packages/adapters/django",
    "packages/adapters/typescript",
    "packages/indexer",
    "packages/ai",
    "packages/security",
    "apps/cli",
    "apps/api",
    "apps/mcp",
]

[tool.uv.sources]
ci-core = { workspace = true }
ci-parsers = { workspace = true }
ci-adapters-django = { workspace = true }
ci-adapters-typescript = { workspace = true }
ci-indexer = { workspace = true }
ci-ai = { workspace = true }
ci-security = { workspace = true }
ci-cli = { workspace = true }
ci-api = { workspace = true }
ci-mcp = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["benchmarks/fixtures"]

[tool.ruff.lint]
# Correctness-first: pyflakes + pycodestyle errors + import sorting off for now (large existing diff).
select = ["E4", "E7", "E9", "F", "B006", "B008", "UP"]
ignore = ["UP037", "B008"]  # B008: typer/FastAPI declare options as defaults by design
