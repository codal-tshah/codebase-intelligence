[project]
name = "ci-indexer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ci-core",
    "ci-parsers",
    "ci-adapters-django",
    "ci-adapters-typescript",
    "gitpython>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_indexer"]

[tool.uv.sources]
ci-core = { workspace = true }
ci-parsers = { workspace = true }
ci-adapters-django = { workspace = true }
ci-adapters-typescript = { workspace = true }
