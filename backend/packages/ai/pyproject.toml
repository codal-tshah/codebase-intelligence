[project]
name = "ci-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ci-core",
    "ci-parsers",
    "ci-security",
    "litellm>=1.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_ai"]

[tool.uv.sources]
ci-core = { workspace = true }
ci-parsers = { workspace = true }
ci-security = { workspace = true }
