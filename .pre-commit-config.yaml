# Local-first hooks; mirrors CI. Install: pre-commit install (in backend venv or pip install pre-commit).
exclude: ^(backend/benchmarks/fixtures/|docs/ui-review/)
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: prettier-frontend
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npm run format:check'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: check-ai-docs
        name: check ai agent docs
        entry: python3 scripts/check_ai_docs.py
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|docs/ai/|\.cursor/rules/|scripts/check_ai_docs\.py)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(backend/benchmarks/fixtures/|docs/ui-review/|backend/uv\.lock|frontend/package-lock\.json)
