[project]
name = "ci-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ci-core",
    "ci-indexer",
    "ci-ai",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_api"]

[tool.uv.sources]
ci-core = { workspace = true }
ci-indexer = { workspace = true }
ci-ai = { workspace = true }
