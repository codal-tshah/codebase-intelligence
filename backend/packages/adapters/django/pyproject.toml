[project]
name = "ci-adapters-django"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ci-core",
    "ci-parsers",
]

[project.entry-points."codebase_intelligence.analyzers"]
python = "ci_adapters_django:ANALYZER"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_adapters_django"]

[tool.uv.sources]
ci-core = { workspace = true }
ci-parsers = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
