[project]
name = "ci-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ci-core",
    "ci-indexer",
    "ci-api",
    "ci-ai",
    "ci-mcp",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
ci = "ci_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_cli"]

[tool.uv.sources]
ci-core = { workspace = true }
ci-indexer = { workspace = true }
ci-api = { workspace = true }
ci-ai = { workspace = true }
ci-mcp = { workspace = true }
